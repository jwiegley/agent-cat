      - captureBytes
      - aggregateInputBytes
      - artifactBytes
      - sseBlockBytes
      - pageBytes
      - pageSetBytes
      - pageSetsPerClient
      - pageSetLifetimeSeconds
      - queuedRequests
      - maxReservations
      - reviewLifetimeSeconds
      - sseReadersPerClient
      - ssePendingBytesPerReader
      - replaySeconds
      - replayBytes
      - heartbeatSeconds
      - reconnectIdleSeconds
      - reconnectBackoffMaxSeconds
      - ordinaryMutationsPerMinute
      - drafts
      - globalDrafts
      - globalCaptureBytes
      - globalPageSets
      - globalConnections
      - globalDatabaseReaders
      - globalMutationLedgerBytes
      - safetyControlsPerMinute
      - executionReservations
      additionalProperties: false
      description: Effective positive configuration bounds. Initial executionReservations
