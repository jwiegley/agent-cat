      additionalProperties: false
      description: Published proves exclusive complete export of a verified source.
        bytes and sha256 describe exactly the exported compact code/value JSON plus
        LF, not the source-result artifact or a manager wrapper. Download is /v1/artifacts/{id},
        using a distinct export handle, and returns those same captured bytes as application/octet-stream
