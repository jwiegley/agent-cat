x-options-policy:
  authentication: none
  resourceAccess: false
  origins: exact local allowlist, null refused
  methods:
  - GET
  - POST
  - OPTIONS
  headers:
  - Authorization
  - Content-Type
  - Accept
  - If-Match
  - Idempotency-Key
  - Last-Event-ID
  successStatus: 204
  refusalStatus: 403
x-lifecycle:
  request:
  - draft
  - queued
  - preparing
  - review
  - start-pending
  - associated
  - withdrawn
  - refused
  preparation:
  - live
  - consumed
  - invalidated
  supervision:
  - owned
  - cleanup-pending
  - lost
  - observer
  decision:
  - pending
  - submitting
  - resolved
  - invalidated
  verification:
  - absent
  - referenced
  - verified
  - unavailable
  invariants:
  - Request readiness is not admission, preparation or runtime state.
  - Editing inputs invalidates admission and live review before start intent.
  - Approval consumes only exact live prepared worker, digest, revisions and process
    generation.
  - Lost supervision never rewrites validated historical running runtime state.
  - Timeout never releases an uncertain per-run FIFO reservation.
  - Review and cleanup retain reservations until verified worker cleanup.
  - No stored record authorizes start or signalling.
