components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque current credential, never query parameter or cookie. Scopes
        and profile access are server-side authorization, not bearer token claims
        trusted from a body.
  schemas:
    ResourceId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^[A-Za-z0-9_-]+$
    AuthorityEpoch:
      allOf:
      - $ref: '#/components/schemas/ResourceId'
      maxLength: 105
      description: At most 105 ASCII characters, reserving one separator and at least
        22 nonce characters within the 128-byte idempotency key bound.
    Revision:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^[A-Za-z0-9_-]+$
      description: Opaque equality token, not an order or authority.
    UInt64Decimal:
      type: string
      minLength: 1
      maxLength: 20
      format: uint64-decimal
      pattern: ^(?:0|[1-9][0-9]{0,18}|1[0-7][0-9]{18}|18[0-3][0-9]{17}|184[0-3][0-9]{16}|1844[0-5][0-9]{15}|18446[0-6][0-9]{14}|184467[0-3][0-9]{13}|1844674[0-3][0-9]{12}|184467440[0-6][0-9]{10}|1844674407[0-2][0-9]{9}|18446744073[0-6][0-9]{8}|1844674407370[0-8][0-9]{6}|18446744073709[0-4][0-9]{5}|184467440737095[0-4][0-9]{4}|18446744073709550[0-9]{3}|18446744073709551[0-5][0-9]{2}|1844674407370955160[0-9]{1}|1844674407370955161[0-4]|18446744073709551615)$
      description: Canonical unsigned decimal string, 0 through 18446744073709551615
        inclusive.
    UInt32Decimal:
      type: string
      minLength: 1
      maxLength: 10
      format: uint32-decimal
      pattern: ^(?:0|[1-9][0-9]{0,8}|[1-3][0-9]{9}|4[0-1][0-9]{8}|42[0-8][0-9]{7}|429[0-3][0-9]{6}|4294[0-8][0-9]{5}|42949[0-5][0-9]{4}|429496[0-6][0-9]{3}|4294967[0-1][0-9]{2}|42949672[0-8][0-9]{1}|429496729[0-4]|4294967295)$
      description: Canonical unsigned decimal string, 0 through 4294967295 inclusive.
    NaturalDecimal:
      type: string
      minLength: 1
      maxLength: 4096
      pattern: ^(0|[1-9][0-9]*)$
      description: Exact nonnegative integer. Refuse values exceeding 4096 decimal
        digits rather than round them.
    ResourceLink:
      type: string
      minLength: 4
      maxLength: 8192
      pattern: ^/v1/[A-Za-z0-9_/?=&.%-]+$
      description: Same-origin API reference. It never carries credentials or authority
        and never follows a cross-origin redirect.
    Sha256:
      type: string
      minLength: 64
      maxLength: 64
      pattern: ^[0-9a-f]{64}$
    StrongETag:
      type: string
      minLength: 3
      maxLength: 130
      format: strong-etag
      pattern: ^"[A-Za-z0-9_-]+"$
      description: One strong quoted opaque validator for the exact GET URI and query.
        No weak validators, lists, or wildcard.
    IdempotencyKey:
      type: string
      minLength: 24
      maxLength: 128
      format: idempotency-key
      pattern: ^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]{22,}$
      description: At most 128 ASCII bytes. authorityEpoch.nonce. AuthorityEpoch is at
        most 105 characters. Generate nonce with at least 128 random bits. Text syntax
        cannot prove entropy.
    EventCursor:
      type: string
      minLength: 3
      maxLength: 149
      pattern: ^[A-Za-z0-9_-]{1,128}\.(?:0|[1-9][0-9]{0,18}|1[0-7][0-9]{18}|18[0-3][0-9]{17}|184[0-3][0-9]{16}|1844[0-5][0-9]{15}|18446[0-6][0-9]{14}|184467[0-3][0-9]{13}|1844674[0-3][0-9]{12}|184467440[0-6][0-9]{10}|1844674407[0-2][0-9]{9}|18446744073[0-6][0-9]{8}|1844674407370[0-8][0-9]{6}|18446744073709[0-4][0-9]{5}|184467440737095[0-4][0-9]{4}|18446744073709550[0-9]{3}|18446744073709551[0-5][0-9]{2}|1844674407370955160[0-9]{1}|1844674407370955161[0-4]|18446744073709551615)$
      description: Opaque stream identity plus canonical UInt64Decimal manager sequence.
        The server checks range, retained floor, view, epoch, and future positions
        on every batch. Gaps in filtered views are not corruption.
    ExportName:
      type: string
      minLength: 1
      maxLength: 128
      format: export-name
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$
      description: One ASCII component, 1 through 128 bytes. No slash, backslash,
        NUL, absolute path, dot or dot-dot. Exclusive publication only.
    FailureClass:
      type: string
      enum:
      - setup
      - transport
      - decode
      - protocol
      - cancelled
      - runtime
    Scopes:
      type: array
      items:
        type: string
        enum:
        - observe
        - submit
        - control
        - export
      maxItems: 4
      uniqueItems: true
    SemanticSchema:
      oneOf:
      - type: string
        enum:
        - 'null'
        - boolean
        - integer
        - number
        - string
        - object
      - type: object
        properties:
          array:
            type: object
            properties:
              items:
                $ref: '#/components/schemas/SemanticSchema'
            required:
            - items
            additionalProperties: false
        required:
        - array
        additionalProperties: false
      - $ref: '#/components/schemas/SemanticProperty'
    SemanticObject:
      oneOf:
      - const: object
        type: string
      - $ref: '#/components/schemas/SemanticProperty'
    SemanticProperty:
      type: object
      properties:
        property:
          type: object
          properties:
            name:
              type: string
              minLength: 0
              maxLength: 1024
            schema:
              $ref: '#/components/schemas/SemanticSchema'
            rest:
              $ref: '#/components/schemas/SemanticObject'
          required:
          - name
          - schema
          - rest
          additionalProperties: false
      required:
      - property
      additionalProperties: false
      description: Property names must be unique along rest. Runtime schema promotion
        checks this contextual constraint. Semantic schema-as-data, not editor JSON
        Schema. Nesting limit 64 applies to the entire payload.
    ObservationCode:
      oneOf:
      - type: string
        enum:
        - text
        - verdict
        - flag
        - receipt
      - type: object
        properties:
          json:
            type: object
            properties:
              schema:
                $ref: '#/components/schemas/SemanticSchema'
            required:
            - schema
            additionalProperties: false
        required:
        - json
        additionalProperties: false
      description: Actual codeJson observation dialect. Receipt is receipt, not internal
        codeToJson ack. Structured codes carry recursive semantic schema. The runtime
        decoder remains authoritative.
    SnapshotCode:
      type: string
      enum:
      - text
      - verdict
      - flag
      - ack
      - structured
      description: Native codeWord string retained by OccurrenceStarted and RunSnapshot,
        not codeJson. Receipt is ack and a structured occurrence is structured. No
        schema is inferred from a non-person occurrence or a missing question artifact.
        Verified question/result data uses ObservationCode separately.
    EditorSchema:
      oneOf:
      - type: object
        properties:
          type:
            type: string
            enum:
            - 'null'
            - boolean
            - integer
            - number
            - string
        required:
        - type
        additionalProperties: false
      - type: object
        properties:
          type:
            const: array
            type: string
          items:
            $ref: '#/components/schemas/EditorSchema'
        required:
        - type
        - items
        additionalProperties: false
      - type: object
        properties:
          type:
            const: object
            type: string
          properties:
            type: object
            maxProperties: 256
            propertyNames:
              type: string
              minLength: 0
              maxLength: 1024
            additionalProperties:
              $ref: '#/components/schemas/EditorSchema'
          required:
            type: array
            items:
              type: string
              minLength: 0
              maxLength: 1024
            maxItems: 256
            uniqueItems: true
          additionalProperties:
            const: false
            type: boolean
        required:
        - type
        - properties
        - required
        - additionalProperties
        additionalProperties: false
      description: Supplementary schema-as-data rendered by Agentic.Schema.Json.jsonSchemaDocument
        for structured codes. Required names equal property names. This is not the
        semantic schema and cannot override the runtime decoder.
    RuntimeValue:
      description: Runtime-governed typed JSON answer or fork replacement. Preserve
        false, null, arrays, exact finite decimal numbers and Unicode. No string coercion.
        Decode against the verified question or parent occurrence code/schema. Structured
        numbers use a finite decimal with base-10 exponent between -4096 and 4096.
        No duplicate keys, nonfinite numbers, invalid Unicode, or depth above 64.
        The encoded native control including framing is at most 1048576 bytes. JSON
        Schema does not implement runtime-dependent typing.
    InputDeclaration:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 1024
        source:
          type: string
          enum:
          - prompt
          - command-tail
          - stdin
        description:
          type: 'null'
        required:
          const: true
          type: boolean
        schema:
          type: object
          properties:
            type:
              const: string
              type: string
          required:
          - type
          additionalProperties: false
      required:
      - name
      - source
      - description
      - required
      - schema
      additionalProperties: false
    SuppliedInput:
      oneOf:
      - type: object
        properties:
          name:
            type: string
            minLength: 1
            maxLength: 1024
          source:
            const: literal
            type: string
          value:
            type: string
            minLength: 0
            maxLength: 2097152
        required:
        - name
        - source
        - value
        additionalProperties: false
      - type: object
        properties:
          name:
            type: string
            minLength: 1
            maxLength: 1024
          source:
            const: capture
            type: string
          captureId: *id001
        required:
        - name
        - source
        - captureId
        additionalProperties: false
    Page:
      type: object
      properties:
        setId: *id001
        revision: &id004
          $ref: '#/components/schemas/Revision'
        expiresAt: &id013
          type: string
          format: date-time
          maxLength: 40
        index:
          type: integer
          minimum: 0
          maximum: 65535
        totalItems:
          type: integer
          minimum: 0
          maximum: 1048576
        next:
          anyOf:
          - *id002
          - type: 'null'
      required:
      - setId
      - revision
      - expiresAt
      - index
      - totalItems
      - next
      additionalProperties: false
      description: Materialized consistent set, bound to client, authorization view,
        query, revision and expiry. Each page is at most 1048576 encoded bytes, set
        at most 67108864, two active sets per client, 60 second lifetime. Assemble
        all pages before installing. No silent truncation. Refuse view-too-large if
        any item or full set cannot fit. First-page ETag is not another page or query
        validator.
    Limits:
      type: object
      properties:
        requestTargetBytes:
          const: 8192
          type: integer
        headerBytes:
          const: 16384
          type: integer
        headerFields:
          const: 100
          type: integer
        jsonBodyBytes:
          const: 2097152
          type: integer
        jsonDepth:
          const: 64
          type: integer
        nativeControlBytes:
          const: 1048576
          type: integer
        captureBytes:
          const: 67108864
          type: integer
        aggregateInputBytes:
          const: 67108864
          type: integer
        artifactBytes:
          const: 67108864
          type: integer
        sseBlockBytes:
          const: 16384
          type: integer
        pageBytes:
          const: 1048576
          type: integer
        pageSetBytes:
          const: 67108864
          type: integer
        pageSetsPerClient:
