      description: Exactly one bounded JSON result on stdout, never secret material.
        Issuance creates a new registered client identity and first credential. Rotation
        preserves that client identity and ledger while revoking the prior credential.
        Commands with excessive result sets refuse size-limit, never truncate. A request
        is at most 2097152 bytes, response at most 1048576 bytes. No paging or HTTP
        administration is implied.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/IdempotencyKey'
      description: Exact retry identity. See info.description for authorization, authority
        epoch, byte preservation and durable receipt/tombstone ordering.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/StrongETag'
      description: One strong ETag from GET on this exact URI and query. Matching
        durable retry is resolved before a new state precondition.
    PageToken:
      name: pageToken
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 512
        pattern: ^[A-Za-z0-9_-]+$
