openapi: 3.1.1
info:
  title: Agent-cat workflow manager
  version: 1.0.0
  description: 'Proposed WM-003 contract, not implemented service. All application
    resources are beneath /v1. Bearer identity and permitted profile access are checked
    on every request. Resource IDs, revisions, cursors and stored history grant no
    authority. Native runtime remains sole interpreter. Read-only GET requires observe.
    POST uses exactly its x-required-scopes, not an implicit observe scope. Receipt
    GET additionally requires current original-operation authority.


    JSON is strict UTF-8, application/json, depth at most 64, no duplicate keys, nonfinite
    numbers, invalid Unicode or unknown command fields. Reject content coding. Bounds
    apply to bytes before unbounded allocation. JSON Schema length is only a supplementary
    code-point bound. Capabilities report positive global quotas. Protected responses
    use Cache-Control: no-store. Redirects never transfer credentials or endpoint-bound
    resource identity.


    Every POST requires Idempotency-Key authorityEpoch.nonce. Preserve exact request
    body bytes, method, canonical resource target and preconditions. Ledger binds
    stable registered client identity. Authenticate and authorize before receipt lookup.
    Reject wrong authority epoch before ledger lookup. Matching retries return original
    durable receipt before evaluating a new transition. Conflicting reuse refuses.
    Credential rotation preserves client and ledger. Active receipts persist and remain
    at least 30 days after resource inactivity, then non-content tombstones remain
    for client lifetime. Receipt expiry never authorizes replay. Restore rotates authority
    and stream, revokes restored credentials and requires reconciliation. Unknown
    effects are never automatically replayed.


    A mutation of an existing resource requires one current strong If-Match from GET
    on the exact same URI and query, including export and lineage collections. Missing
    gives 428, stale 412, weak/wildcard/list invalid gives 400. Create draft and raw
    capture creation alone omit If-Match. A 201 creates a draft, 202 records coordination
    intent, neither proves runtime delivery, terminal success or verified artifacts.


    OPTIONS is the sole unauthenticated operation, shared across advertised paths.
    It checks only exact allowlisted Origin, advertised method and allowed headers,
    never resource existence/state, bearer scope or profile. It authorizes no subsequent
    operation. Unexpected origins and Origin:null refuse, cookie auth, query tokens
    and wildcard credentialed CORS are absent. Native authenticated clients may omit
    Origin. Trust exact Host and configured proxy boundary. No network admin paths
    exist.


    SSE server framing is LF UTF-8 with exactly id, event, data lines in that order
    followed by a blank line. Data is one compact JSON Invalidation, ID is EventCursor.
    A comment-only heartbeat block has no ID and emits no event. A final incomplete
    block emits nothing and is discarded on close. Complete block maximum 16384 bytes.
    No retry or unknown fields in canonical server output. Last-Event-ID is the /snapshot
    cursor. Wrong-stream, view-invalid, expired and future cursors require a new snapshot,
    including on an open stream. JSON polling uses the same durable cursor. Heartbeat
    15 seconds, reconnect after 45 seconds without bytes with jittered exponential
    backoff capped at 30 seconds. Serial refresh per resource, dirty flag for coalescing
    and fetch generations discard stale responses after resnapshot/endpoint change.
    Closing all clients never closes manager worker pipes.


    Local CLI: RUNNER --manager serve --config ABSOLUTE_FILE, RUNNER --manager admin
    --config ABSOLUTE_FILE, RUNNER --tui --service CLIENT_PROFILE, RUNNER --tui --local.
    These are future contracts, not current commands. Admin schemas describe stdin-through-EOF
    JSON and bounded stdout. No bearer values in arguments or ordinary stdout. Secret
    creation is exclusive private output only. Restore is offline with verified physical
    fencing and no automatic credential reprovisioning. Quarantine release requires
    verified cleanup evidence.'
