# A minimal version-2 user routing file.
#
# Copy this file to $XDG_CONFIG_HOME/agent-cat/routing.yaml (by default
# ~/.config/agent-cat/routing.yaml) and check it with:
#
#   agentic-run --routing --offline
#
# It defines one engine for each built-in ACP adapter. It needs no environment
# variable, no model catalogue and no secret. The default persona is "stub",
# which uses the deterministic test adapter. That adapter is a data file of the
# package, so a stub run works from any working directory. Select another
# persona with --persona NAME or AGENT_CAT_PERSONA.
#
# The model identifiers of the claude, codex and droid models are examples.
# Replace each one with a model value that the adapter offers:
#
#   agentic-run adapter-options --adapter claude
#
# A value that the adapter does not offer is refused at launch, before any
# prompt, and the refusal lists the offered values.

version: 2
default-persona: stub

engines:
  stub:
    backend: acp:stub
    provider: agent-cat
  claude:
    backend: acp:claude
    provider: anthropic
  codex:
    backend: acp:codex
    provider: openai
  droid:
    backend: acp:droid
    provider: factory

models:
  stub-default:
    engine: stub
    select:
      - exact: stub-default
  claude-default:
    engine: claude
    select:
      - exact: default
  codex-default:
    engine: codex
    select:
      - exact: gpt-5-codex
  droid-default:
    engine: droid
    select:
      - exact: claude-sonnet-4-5

personas:
  stub:
    engines: [stub]
    models: [stub-default]
    profiles:
      deep:
        chain:
          - model: stub-default
            thinking: high
            max-output: unconstrained
      balanced:
        chain:
          - model: stub-default
            thinking: medium
            max-output: unconstrained
      review:
        chain:
          - model: stub-default
            thinking: high
            max-output: unconstrained
      reasoning:
        chain:
          - model: stub-default
            thinking: high
            max-output: unconstrained
      coding:
        chain:
          - model: stub-default
            thinking: medium
            max-output: unconstrained

  claude:
    engines: [claude]
    models: [claude-default]
    profiles:
      deep:
        chain:
          - model: claude-default
            thinking: high
            max-output: unconstrained
      balanced:
        chain:
          - model: claude-default
            thinking: medium
            max-output: unconstrained
      review:
        chain:
          - model: claude-default
            thinking: high
            max-output: unconstrained
      reasoning:
        chain:
          - model: claude-default
            thinking: high
            max-output: unconstrained
      coding:
        chain:
          - model: claude-default
            thinking: medium
            max-output: unconstrained

  codex:
    engines: [codex]
    models: [codex-default]
    profiles:
      deep:
        chain:
          - model: codex-default
            thinking: high
            max-output: unconstrained
      balanced:
        chain:
          - model: codex-default
            thinking: medium
            max-output: unconstrained
      review:
        chain:
          - model: codex-default
            thinking: high
            max-output: unconstrained
      reasoning:
        chain:
          - model: codex-default
            thinking: high
            max-output: unconstrained
      coding:
        chain:
          - model: codex-default
            thinking: medium
            max-output: unconstrained

  droid:
    engines: [droid]
    models: [droid-default]
    profiles:
      deep:
        chain:
          - model: droid-default
            thinking: high
            max-output: unconstrained
      balanced:
        chain:
          - model: droid-default
            thinking: medium
            max-output: unconstrained
      review:
        chain:
          - model: droid-default
            thinking: high
            max-output: unconstrained
      reasoning:
        chain:
          - model: droid-default
            thinking: high
            max-output: unconstrained
      coding:
        chain:
          - model: droid-default
            thinking: medium
            max-output: unconstrained

# The variant with secrets and model catalogues.
#
# An engine can receive an API key from an environment variable, and it can
# discover its model identifiers from a catalogue. Discovery supports only
# plain HTTP, so a catalogue works only at a loopback http address, and a
# catalogue with authentication requires https and therefore cannot be
# discovered. An engine whose secret variable is unset is shown with
# credentialReady false by --routing, and a launch that needs it is refused.
#
# secrets:
#   anthropic-personal:
#     env: ANTHROPIC_PERSONAL_API_KEY
#
# engines:
#   claude-personal:
#     backend: acp:claude
#     provider: anthropic
#     environment:
#       ANTHROPIC_API_KEY:
#         secret: anthropic-personal
#   local-server:
#     backend: acp:PATH-TO-AN-ACP-ADAPTER
#     provider: local
#     catalogue:
#       dialect: openai
#       url: http://127.0.0.1:8080/v1/models
#       timeout-ms: 5000
#       max-bytes: 4194304
#       cache:
#         fresh-for: 24h
#         stale-if-error: 7d
#
# models:
#   local-newest:
#     engine: local-server
#     select:
#       - prefix: local-model-
#         order: newest
