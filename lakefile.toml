name = "agentic"
version = "0.1.0"
defaultTargets = ["Agentic", "Pollution", "Conformance", "conformance-oracle", "corpus-gen"]

# The root module and every `Agentic/Core/*` module. The glob is explicit rather
# than implied by the root's imports, because a module the root does not import
# would otherwise be invisible to `lake build`; with the glob, one that stops
# compiling breaks the build like everything else.
#
# WHERE THE BUILD TIME IS. One module in this glob dominates the whole build:
# `Agentic/Core/DslFlagship.lean` takes about six minutes and several gigabytes
# to elaborate, because its nineteen `decide +kernel` proofs make the kernel run
# the checker, the cost algebra and the interpreter on the flagship `Raw` term —
# the theorems about the flagship are true by computation, not by assertion, and
# that is what computation costs. Never elaborate it twice concurrently; two at
# once have exhausted 48 GB on a developer machine.
#
# It is a separate module from `Agentic/Core/Dsl.lean` for exactly that reason.
# `Dsl.lean` is the cheap half — the level theorems about the *checker*, about a
# second and a half — and it is all that `Agentic/Core/Explain.lean` and, through
# it, `conformance/Conformance.lean` need, so the conformance oracle and the
# corpus generator do not import the flagship and build in seconds rather than
# minutes. Keep it so: if a tool comes to need something proved about the
# flagship, move the *statement* into the cheap half rather than the import into
# the tool.
[[lean_lib]]
name = "Agentic"
globs = ["Agentic", "Agentic.Core.+"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.30.0"

# The instance-pollution probe (test/Pollution.lean): machine-checked assertions
# that importing this package installs no arithmetic on `Bool`, `Prop` or `ℕ`.
# In defaultTargets on purpose — a re-polluting instance must break the build.
[[lean_lib]]
name = "Pollution"
srcDir = "test"

# The conformance oracle (conformance/ConformanceOracle.lean):
# `lake exe conformance-oracle`. The Lean side of the bisimulation with the
# Haskell implementation (doc/research/connection.md, D4): a
# line-delimited JSON process that checks and observes RawPrograms, so the
# frozen corpus under test/corpus/ is this executable's output committed. A
# test dependency and only ever a test dependency — the production runner
# (`agentic-run`, in haskell/) never speaks to it. It imports
# Agentic.Core.{Explain,Report} and *not* Agentic.Core.DslFlagship, so it builds
# in seconds, not minutes.
# Its library half (conformance/Conformance.lean): the codecs, the WorldSpec
# DSL, the observation record and the refusal classifier — importable by the
# corpus generator and by any future harness tooling.
[[lean_lib]]
name = "Conformance"
srcDir = "conformance"

[[lean_exe]]
name = "conformance-oracle"
srcDir = "conformance"
root = "ConformanceOracle"

# The corpus generator (test/CorpusGen.lean): `lake exe corpus-gen`, from the
# repository root. It reads every test/corpus/*.json, takes each file's request
# verbatim, puts it back through the conformance library's `observe` or
# `stringOp`, and rewrites the file with the fresh reply. Regenerating is
# therefore expected to be a *no-op*: `lake exe corpus-gen` followed by an empty
# `git status --short test/corpus` is the statement that the elaboration, the
# cost algebra, the interpreter and the trusted base still say what the frozen
# specification says they say.
# In defaultTargets so that a generator which stops compiling with the library it
# regenerates breaks the build; *running* it is the separate, explicit step, and
# a diff it produces is a change to the specification, reviewed as one. It
# imports Conformance and not the flagship.
[[lean_exe]]
name = "corpus-gen"
srcDir = "test"
root = "CorpusGen"
