name = "agentic"
version = "0.1.0"
defaultTargets = ["Agentic", "Pollution"]

[[lean_lib]]
name = "Agentic"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.30.0"

# The worked example (doc/walkthrough.html §VII as real Lean). Deliberately not
# in defaultTargets: it is verified against the commit it was authored on and
# is re-verified/ported when the library's API moves (tracker: acat-h0k).
# Build it explicitly with `lake build HardenPatch`.
[[lean_lib]]
name = "HardenPatch"
srcDir = "example"

# The instance-pollution probe (test/Pollution.lean): machine-checked assertions
# that importing this package installs no arithmetic on `Bool`, `Prop` or `ℕ`.
# In defaultTargets on purpose — a re-polluting instance must break the build.
[[lean_lib]]
name = "Pollution"
srcDir = "test"
